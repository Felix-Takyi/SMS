<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163e38">
  <title>School office | Fieldnote</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body class="app-page">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand brand-light" href="#home" aria-label="Fieldnote dashboard">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span>Fieldnote <small>School office</small></span>
      </a>
      <div class="school-switcher"><span class="school-initial">S</span><span><strong>School workspace</strong><small>Local workspace</small></span><span class="switch-caret" aria-hidden="true">&#8964;</span></div>
      <nav class="primary-nav" aria-label="Main navigation">
        <p class="nav-caption">WORKSPACE</p>
        <a href="#home" data-nav="home"><span class="nav-mark">01</span>Overview</a>
        <a href="#students" data-nav="students" data-permission="STUDENT_VIEW"><span class="nav-mark">02</span>Students</a>
        <a href="#academics" data-nav="academics" data-permission="ACADEMICS_VIEW"><span class="nav-mark">03</span>Academics</a>
        <a href="#attendance" data-nav="attendance" data-permission="ATTENDANCE_VIEW"><span class="nav-mark">04</span>Attendance</a>
        <a href="#results" data-nav="results" data-permission="ASSESSMENT_VIEW"><span class="nav-mark">05</span>Assessments &amp; results</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection-status"><span class="status-dot"></span><span><strong>Local server</strong><small>Connected securely</small></span></div>
        <button class="profile-button" id="sign-out" type="button">
          <span class="profile-avatar" id="user-avatar">--</span>
          <span class="profile-copy"><strong id="user-name">Staff member</strong><small id="user-role">School staff</small></span>
          <span class="signout-mark" aria-hidden="true">&#8599;</span>
        </button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">MENU</button>
        <div class="breadcrumbs"><span>FIELDNOTE</span><span aria-hidden="true">/</span><strong id="page-crumb">OVERVIEW</strong></div>
        <div class="topbar-right"><span class="today-label" id="today-label"></span><span class="topbar-rule"></span><span class="staff-label" id="topbar-user">Staff</span></div>
      </header>
      <div id="view-root" class="view-root" aria-live="polite">
        <div class="loading-state">Opening your school workspace...</div>
      </div>
      <footer class="app-footer"><span>FIELDNOTE SCHOOL MANAGEMENT</span><span>LOCAL FIRST <i></i> PRIVATE BY DESIGN</span></footer>
    </main>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
