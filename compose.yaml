services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_management
      POSTGRES_USER: school_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the process environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - school-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_app -d school_management"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  school-postgres-data:
